<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Resep Klasik - Dapur Burgundy</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

  
  <header class="book-header">
    <h1>📖 Buku Resep Dapur</h1>
    <p>Koleksi hidangan rumahan pilihan yang hangat dan istimewa</p>
    
    
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Cari judul resep di buku...">
      <select id="tocSelect">
       
      </select>
    </div>
  </header>

 
  <main class="book-wrapper">
    <div class="book-cover">
      <div class="book-spread" id="bookSpread">
        
        
        <div class="page left-page">
          <div class="page-header">
            <span class="category-badge" id="recipeCategory">Kategori</span>
            <span class="page-number" id="leftPageNum">Hal. 1</span>
          </div>
          
          <h2 class="recipe-title" id="recipeTitle">Judul Resep</h2>
          <p class="recipe-meta" id="recipeTime">⏱️ Waktu Masak: 15 Menit</p>
          
          <div class="photo-frame">
            <img id="recipeImg" src="" alt="Foto Masakan">
          </div>

          <h3 class="section-heading">Bahan-Bahan</h3>
          <ul class="ingredients-list" id="recipeIngredients"></ul>
        </div>

        
        <div class="book-spine"></div>

       
        <div class="page right-page">
          <div class="page-header">
            <span class="book-subtitle">Dapur Ala Restoran</span>
            <span class="page-number" id="rightPageNum">Hal. 2</span>
          </div>

          <h3 class="section-heading">Cara Membuat</h3>
          <ol class="steps-list" id="recipeSteps"></ol>

          <div class="chef-note">
            <strong>💡 Catatan Dapur:</strong>
            <p id="recipeNote">Sajikan selagi hangat untuk rasa terbaik.</p>
          </div>
        </div>

      </div>
    </div>

    <div class="book-navigation">
      <button id="prevBtn" class="nav-btn">❮ Halaman Sebelumnya</button>
      <span id="pageIndicator">Resep 1 dari 3</span>
      <button id="nextBtn" class="nav-btn">Halaman Selanjutnya ❯</button>
    </div>









  </main>

  <script src="../js/script.js"></script>
</body>
</html>
